# Lightweight predecessor-trail follower parameters.
follower_node:
  ros__parameters:
    leader_topic: /leader/odom
    own_odom_topic: odom
    ir_topic: ir_distances
    cmd_topic: cmd_vel_follower
    rate: 20.0

    # Cars must start parallel and approximately target_gap metres apart.
    target_gap: 1.2
    path_spacing: 0.03
    lookahead: 0.30
    kp_gap: 0.8
    k_heading: 1.5
    k_lateral: 1.0
    v_max: 0.4
    w_max: 1.2
    track_width: 0.329
    leader_timeout: 0.5
    sensor_timeout: 0.5

    use_apf: true
    apf_influence: 0.7
    apf_stop: 0.18
    apf_turn_gain: 0.8
    apf_side_deadband: 0.12
