<body>
<div class="shell">
  <header class="masthead">
    <div>
      <h1>K7 小车 · 架构与接口</h1>
      <p id="scope" class="context muted"></p>
    </div>
    <div class="top-actions">
      <a href="K7_开发架构方案.md">架构手册</a>
      <button id="theme" type="button" aria-label="切换深浅主题">深色</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="架构视图"></nav>
  <section id="diagram-panel" class="panel" role="tabpanel" aria-label="架构图">
    <div class="diagram-intro"><p id="diagram-note"></p><button id="open-diagram" type="button">单独打开此图 ↗</button></div>
    <div class="diagram-host" id="diagram-host"></div>
    <div class="interface-shortcuts"><p>查看接口字段与示例，也可双击图中带话题名称的连线</p><div class="chips" id="shortcuts"></div></div>
  </section>
  <section id="dictionary-panel" class="panel" role="tabpanel" aria-label="接口字典" hidden>
    <div class="dictionary-toolbar">
      <label for="search" class="sr-only">搜索接口、节点或字段</label>
      <input id="search" type="search" placeholder="搜索接口、节点或字段…" autocomplete="off">
      <div class="filter-group" id="filters" aria-label="接口类型"></div>
    </div>
    <div class="dictionary-layout">
      <nav id="interface-nav" class="interface-nav" aria-label="接口列表"></nav>
      <article id="detail" class="detail"></article>
    </div>
  </section>
  <details id="node-index" class="node-index"><summary>节点职责与源码</summary><div id="nodes" class="node-grid"></div></details>
  <footer class="footer"><span id="revision"></span><span>消息样例中的数值为示意。图表支持缩放、主题与导出。</span></footer>
</div>
<script id="architecture-data" type="application/json">__ARCHITECTURE_DATA__</script>
<script>
'use strict';
const data = JSON.parse(document.getElementById('architecture-data').textContent);
const $ = id => document.getElementById(id);
const shortcuts = {
  overview: ['image','scan','reference','candidate','cmd-vel','odom','task-status','control-status','debug'],
  control: ['action-leader','srv-select','reference','candidate','cmd-vel','srv-stop','task-status'],
  services: ['srv-manual','srv-stop','srv-select','srv-hold','srv-record','action-path','action-leader'],
  fleet: ['fleet-state','leader-state','link','esp-fleet','esp-status']
};
let currentDiagram = data.diagrams[0];
let currentInterface = data.interfaces[0].id;
let filterKind = '全部';
let frame;
let theme = 'light';
try { theme = localStorage.getItem('k7-architecture-theme') || 'light'; } catch (_) {}
function element(tag, text, className) {
  const item = document.createElement(tag);
  if (text !== undefined) item.textContent = text;
  if (className) item.className = className;
  return item;
}
function sourceLink(source) {
  const anchor = element('a', source.label || source.path.split('/').pop() + ':' + source.line);
  anchor.href = data.repository.url.replace(/\.git$/, '') + '/blob/' + data.repository.revision + '/' + source.path + '#L' + source.line + (source.end_line ? '-L' + source.end_line : '');
  anchor.target = '_blank'; anchor.rel = 'noopener noreferrer';
  return anchor;
}
function applyTheme(value) {
  theme = value === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  $('theme').textContent = theme === 'dark' ? '浅色' : '深色';
  try { localStorage.setItem('k7-architecture-theme', theme); localStorage.setItem('archify-theme', theme); } catch (_) {}
  if (frame && frame.contentDocument) {
    frame.contentDocument.documentElement.dataset.theme = theme;
    frame.contentWindow.dispatchEvent(new Event('resize'));
  }
}
function renderDiagram() {
  // Archify fits its diagram to its viewport. Keep that viewport independent
  // of content height to avoid a resize loop between the two documents.
  frame = document.createElement('iframe');
  frame.title = currentDiagram.label;
  frame.srcdoc = currentDiagram.html;
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    doc.documentElement.dataset.theme = theme;
    doc.addEventListener('dblclick', event => {
      const edge = event.target.closest('[data-edge-label]');
      const label = edge && edge.dataset.edgeLabel;
      const api = label && data.interfaces.find(item => label.includes(item.name));
      if (api) {
        event.preventDefault();
        event.stopPropagation();
        selectInterface(api.id);
      }
    }, true);
  });
  $('diagram-host').replaceChildren(frame);
  $('diagram-note').textContent = currentDiagram.note;
  $('shortcuts').replaceChildren();
  for (const id of shortcuts[currentDiagram.id]) {
    const api = data.interfaces.find(item => item.id === id);
    const button = element('button', api.name);
    button.type = 'button';
    button.addEventListener('click', () => selectInterface(id));
    $('shortcuts').append(button);
  }
}
function showTab(id, writeHash = true) {
  const dictionary = id === 'dictionary';
  $('diagram-panel').hidden = dictionary;
  $('dictionary-panel').hidden = !dictionary;
  $('node-index').hidden = dictionary;
  for (const button of $('tabs').children) {
    button.setAttribute('aria-selected', String(button.dataset.tab === id));
    button.tabIndex = button.dataset.tab === id ? 0 : -1;
  }
  if (!dictionary) {
    currentDiagram = data.diagrams.find(item => item.id === id) || data.diagrams[0];
    renderDiagram();
  }
  if (writeHash) history.replaceState(null, '', '#' + (dictionary ? 'interface=' + currentInterface : id));
}
function selectInterface(id) {
  currentInterface = id;
  filterKind = '全部';
  $('search').value = '';
  renderFilters(); renderInterfaceList(); renderDetail();
  showTab('dictionary');
  $('dictionary-panel').scrollIntoView({block:'start', behavior:'smooth'});
}
function renderFilters() {
  $('filters').replaceChildren();
  for (const kind of ['全部','话题','服务','Action','串口帧']) {
    const button = element('button', kind); button.type = 'button';
    button.setAttribute('aria-pressed', String(filterKind === kind));
    button.addEventListener('click', () => { filterKind = kind; renderFilters(); renderInterfaceList(); });
    $('filters').append(button);
  }
}
function renderInterfaceList() {
  const query = $('search').value.trim().toLowerCase();
  const items = data.interfaces.filter(item => (filterKind === '全部' || item.kind === filterKind) && JSON.stringify([item.name,item.type,item.owner,item.receivers,item.fields]).toLowerCase().includes(query));
  $('interface-nav').replaceChildren();
  if (!items.length) { $('interface-nav').append(element('p','没有匹配的接口','empty')); return; }
  for (const item of items) {
    const button = element('button'); button.type = 'button';
    button.setAttribute('aria-selected', String(currentInterface === item.id));
    button.append(element('span',item.kind,'kind'), element('span',item.name,'name'));
    button.addEventListener('click', () => {
      currentInterface = item.id;
      history.replaceState(null, '', '#interface=' + item.id);
      renderInterfaceList(); renderDetail();
    });
    $('interface-nav').append(button);
  }
}
async function copyText(text, button) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const textarea = element('textarea',text);
    document.body.append(textarea); textarea.select();
    document.execCommand('copy'); textarea.remove();
  }
  button.textContent = '已复制'; setTimeout(() => button.textContent = '复制', 1500);
}
function codeBlock(title, text) {
  const block = element('div'); const header = element('div',undefined,'code-head');
  const button = element('button','复制'); button.type = 'button';
  button.addEventListener('click', () => copyText(text, button));
  header.append(element('h3',title),button); block.append(header,element('pre',text));
  return block;
}
function renderDetail() {
  const api = data.interfaces.find(item => item.id === currentInterface);
  const article = $('detail'); article.replaceChildren();
  const title = element('div',undefined,'detail-title');
  const heading = element('div'); heading.append(element('div',api.kind,'kind'),element('h2',api.name)); title.append(heading);
  article.append(title,element('div',api.type,'type-line'),element('p',api.summary));
  const flow = element('div',undefined,'flow');
  const clientServer = ['服务','Action'].includes(api.kind);
  for (const [label,value] of [[clientServer?'客户端':'发布/发送方',api.owner],[clientServer?'服务端':'订阅/接收方',api.receivers],['频率 / 条件',api.frequency]]) {
    const cell = element('div'); cell.append(element('span',label),element('strong',value)); flow.append(cell);
  }
  article.append(flow);
  const wrapper = element('div',undefined,'table-wrap'); const table = element('table');
  const header = element('tr'); for (const label of ['字段','类型','内容 / 单位']) header.append(element('th',label));
  const thead = element('thead'); thead.append(header); const tbody = element('tbody');
  for (const values of api.fields) { const row=element('tr'); for (const value of values) row.append(element('td',value)); tbody.append(row); }
  table.append(thead,tbody); wrapper.append(table); article.append(wrapper);
  const codes = element('div',undefined,'code-grid' + (api.raw_definition?'':' single'));
  codes.append(codeBlock('消息样例（示意）',api.sample));
  if (api.raw_definition) codes.append(codeBlock('源码定义',api.raw_definition));
  article.append(codes);
  const sources=element('div',undefined,'sources'); for (const source of api.sources) sources.append(sourceLink(source)); article.append(sources);
}
function route() {
  const hash=location.hash.slice(1);
  if (hash.startsWith('interface=')) {
    const id=hash.slice(10);
    if(data.interfaces.some(item=>item.id===id))currentInterface=id;
    renderInterfaceList(); renderDetail(); showTab('dictionary',false);
  } else showTab(data.diagrams.some(item=>item.id===hash)?hash:'overview',false);
}
$('scope').textContent=data.scope;
$('revision').textContent='源码快照 ' + data.repository.revision.slice(0,7) + ' · 整理于 ' + data.date;
for (const tab of [...data.diagrams,{id:'dictionary',label:'接口字典'}]) {
  const button=element('button',tab.label); button.type='button'; button.dataset.tab=tab.id;
  button.id='tab-'+tab.id; button.setAttribute('role','tab'); button.setAttribute('aria-controls',tab.id==='dictionary'?'dictionary-panel':'diagram-panel');
  button.addEventListener('click',()=>showTab(tab.id)); $('tabs').append(button);
}
$('tabs').addEventListener('keydown', event=>{
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  const buttons=[...$('tabs').children];const index=buttons.indexOf(document.activeElement);if(index<0)return;
  event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
  buttons[next].focus();showTab(buttons[next].dataset.tab);
});
for (const node of data.nodes) {
  const card=element('article');card.append(element('strong',node.name),element('p',node.text),sourceLink(node.source));$('nodes').append(card);
}
$('theme').addEventListener('click',()=>applyTheme(theme==='light'?'dark':'light'));
$('search').addEventListener('input',renderInterfaceList);
$('open-diagram').addEventListener('click',()=>{
  const url=URL.createObjectURL(new Blob([currentDiagram.html],{type:'text/html'}));
  window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);
});
window.addEventListener('hashchange',route);
renderFilters();renderInterfaceList();renderDetail();applyTheme(theme);route();
</script>
