  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;section id=&quot;stm32-flow-viz&quot; class=&quot;w-full&quot;&gt;
  &lt;style&gt;
    #stm32-flow-viz {

    #stm32-flow-viz svg text {

    #stm32-flow-viz svg .muted { fill: var(--muted-foreground); }
    #stm32-flow-viz svg .node rect,
    #stm32-flow-viz svg .node polygon {

    }
    #stm32-flow-viz svg .t1 rect,
    #stm32-flow-viz svg .t1 polygon { fill: var(--viz-series-1); fill-opacity: .13; stroke: var(--viz-series-1); }
    #stm32-flow-viz svg .t2 rect,
    #stm32-flow-viz svg .t2 polygon { fill: var(--viz-series-2); fill-opacity: .13; stroke: var(--viz-series-2); }
    #stm32-flow-viz svg .t3 rect,
    #stm32-flow-viz svg .t3 polygon { fill: var(--viz-series-3); fill-opacity: .13; stroke: var(--viz-series-3); }
    #stm32-flow-viz svg .t4 rect,
    #stm32-flow-viz svg .t4 polygon { fill: var(--viz-series-4); fill-opacity: .13; stroke: var(--viz-series-4); }
    #stm32-flow-viz svg .t5 rect,
    #stm32-flow-viz svg .t5 polygon { fill: var(--viz-series-5); fill-opacity: .13; stroke: var(--viz-series-5); }
    #stm32-flow-viz svg .neutral rect {
      fill: var(--muted);
      stroke: var(--border);
    }
    #stm32-flow-viz svg .edge {
      fill: none;
      stroke: var(--muted-foreground);
      stroke-width: 1.5;
      marker-end: url(#stm32-arrow);
    }
    #stm32-flow-viz svg .edge-dashed {
      stroke-dasharray: 5 5;
    }
    #stm32-flow-viz svg .feedback {
      stroke: var(--viz-series-4);
      stroke-width: 2;
      stroke-dasharray: 7 4;
    }
    #stm32-flow-viz svg .zone {
      fill: var(--muted);
      fill-opacity: .52;
      stroke: var(--border);
      stroke-dasharray: 4 4;
    }
    #stm32-flow-viz svg .priority-line {
      stroke: var(--border);
      stroke-width: 1;
    }
    #stm32-flow-viz .viz-detail {
      margin: 0.65rem 0 0;
      color: var(--muted-foreground);
      font-size: 0.78rem;
      min-height: 1.25rem;
    }
    #stm32-flow-viz .viz-detail strong { color: var(--foreground); }
    #stm32-flow-viz .viz-table-wrap {
      margin-top: 0.7rem;
      overflow-x: auto;
    }
    #stm32-flow-viz table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.75rem;
    }
    #stm32-flow-viz th,
    #stm32-flow-viz td {
      border-bottom: 1px solid var(--border);
      padding: 0.48rem 0.55rem;
      text-align: left;
      vertical-align: top;
    }
    #stm32-flow-viz th {
      color: var(--muted-foreground);
      font-weight: 600;
      white-space: nowrap;
    }
    #stm32-flow-viz td:first-child {
      color: var(--foreground);
      font-weight: 600;
      white-space: nowrap;
    }
    #stm32-flow-viz .viz-note {
      margin-top: 0.7rem;
      border-left: 3px solid var(--viz-series-5);
      padding: 0.45rem 0.65rem;
      color: var(--muted-foreground);
      font-size: 0.75rem;
      background: var(--muted);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    #stm32-flow-viz .viz-note strong { color: var(--foreground); }
    @media (max-width: 720px) {
      #stm32-flow-viz .viz-head { display: block; }
      #stm32-flow-viz .viz-controls { margin-top: 0.75rem; }
      #stm32-flow-viz .viz-tab { flex: 1 1 auto; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-head&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;stm32-view-title&quot;&gt;STM32F407 板级工作总览&lt;/h2&gt;
      &lt;p id=&quot;stm32-view-subtitle&quot; class=&quot;viz-subtitle&quot;&gt;以 MCU 时钟为脉络，逐层查看启动、调度、中断与控制闭环。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-controls&quot; role=&quot;group&quot; aria-label=&quot;选择板级流程视图&quot;&gt;
    &lt;button class=&quot;btn viz-tab&quot; type=&quot;button&quot; data-view=&quot;clock&quot; aria-pressed=&quot;true&quot;&gt;1. 时钟树&lt;/button&gt;
    &lt;button class=&quot;btn viz-tab&quot; type=&quot;button&quot; data-view=&quot;boot&quot; aria-pressed=&quot;false&quot;&gt;2. 上电启动&lt;/button&gt;
    &lt;button class=&quot;btn viz-tab&quot; type=&quot;button&quot; data-view=&quot;tasks&quot; aria-pressed=&quot;false&quot;&gt;3. RTOS 任务&lt;/button&gt;
    &lt;button class=&quot;btn viz-tab&quot; type=&quot;button&quot; data-view=&quot;irq&quot; aria-pressed=&quot;false&quot;&gt;4. 中断仲裁&lt;/button&gt;
    &lt;button class=&quot;btn viz-tab&quot; type=&quot;button&quot; data-view=&quot;flow&quot; aria-pressed=&quot;false&quot;&gt;5. 通信与闭环&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-stage&quot; aria-live=&quot;polite&quot;&gt;
    &lt;svg id=&quot;stm32-diagram&quot; viewBox=&quot;0 0 1120 540&quot; role=&quot;img&quot; aria-labelledby=&quot;stm32-svg-title stm32-svg-desc&quot;&gt;
      &lt;title id=&quot;stm32-svg-title&quot;&gt;STM32F407 板级流程图&lt;/title&gt;
      &lt;desc id=&quot;stm32-svg-desc&quot;&gt;可切换查看时钟树、启动过程、FreeRTOS任务、中断优先级和通信闭环。&lt;/desc&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;p id=&quot;stm32-detail&quot; class=&quot;viz-detail&quot;&gt;&lt;/p&gt;
  &lt;div id=&quot;stm32-table&quot; class=&quot;viz-table-wrap&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;stm32-note&quot; class=&quot;viz-note&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;stm32-flow-viz&#x27;);
      const svg = root.querySelector(&#x27;#stm32-diagram&#x27;);
      const title = root.querySelector(&#x27;#stm32-view-title&#x27;);
      const subtitle = root.querySelector(&#x27;#stm32-view-subtitle&#x27;);
      const detail = root.querySelector(&#x27;#stm32-detail&#x27;);
      const tableWrap = root.querySelector(&#x27;#stm32-table&#x27;);
      const note = root.querySelector(&#x27;#stm32-note&#x27;);
      const NS = &#x27;http://www.w3.org/2000/svg&#x27;;

      const views = {
        clock: {
          title: &#x27;时钟树：所有时间尺度从 8 MHz HSE 展开&#x27;,
          subtitle: &#x27;MCU 是 STM32F407VE；MPU6050/ICM20948 是外部 IMU，不是系统时钟源。&#x27;,
          detail: &#x27;&lt;strong&gt;主时基：&lt;/strong&gt;HCLK 168 MHz → FreeRTOS 1 ms tick、DWT 5.95 ns/计数；APB 定时器在分频不为 1 时自动 ×2。&#x27;,
          note: &#x27;&lt;strong&gt;时钟故障要点：&lt;/strong&gt;若 HSE/PLL 未成功，芯片可能仍以约 16 MHz HSI 运行，但工程中的 SystemCoreClock 与 delay_init 仍按 168 MHz 计算，UART、RTOS tick、PWM 和 GY53 距离都会整体失真。&#x27;,
          table: [
            [&#x27;节点&#x27;, &#x27;计算&#x27;, &#x27;实际频率&#x27;, &#x27;直接使用者&#x27;],
            [&#x27;PLL 输入&#x27;, &#x27;HSE 8 MHz ÷ PLLM 8&#x27;, &#x27;1 MHz&#x27;, &#x27;PLL VCO 输入&#x27;],
            [&#x27;PLL VCO&#x27;, &#x27;1 MHz × PLLN 336&#x27;, &#x27;336 MHz&#x27;, &#x27;PLLP、PLLQ&#x27;],
            [&#x27;SYSCLK / HCLK&#x27;, &#x27;336 MHz ÷ PLLP 2；AHB ÷1&#x27;, &#x27;168 MHz&#x27;, &#x27;Cortex-M4F、SysTick、DWT、AHB&#x27;],
            [&#x27;PCLK1 / APB1 定时器&#x27;, &#x27;HCLK ÷4；定时器再 ×2&#x27;, &#x27;42 / 84 MHz&#x27;, &#x27;TIM2/3/4/5 编码器等&#x27;],
            [&#x27;PCLK2 / APB2 定时器&#x27;, &#x27;HCLK ÷2；定时器再 ×2&#x27;, &#x27;84 / 168 MHz&#x27;, &#x27;TIM1 遥控捕获、TIM8 电机 PWM&#x27;],
            [&#x27;PLL48CLK&#x27;, &#x27;336 MHz ÷ PLLQ 7&#x27;, &#x27;48 MHz&#x27;, &#x27;USB OTG FS&#x27;],
            [&#x27;FreeRTOS tick&#x27;, &#x27;168 MHz ÷ 1000&#x27;, &#x27;1 kHz（1 ms）&#x27;, &#x27;任务延时、时间片、软件定时器&#x27;],
            [&#x27;TIM8 PWM&#x27;, &#x27;168 MHz ÷ (16799+1)&#x27;, &#x27;10 kHz&#x27;, &#x27;四路电机占空比输出&#x27;]
          ]
        },
        boot: {
          title: &#x27;上电启动：从复位向量到稳定运行&#x27;,
          subtitle: &#x27;大写 SystemInit 配时钟，小写 systemInit 配板载设备；两者不要混淆。&#x27;,
          detail: &#x27;&lt;strong&gt;关键分界：&lt;/strong&gt;外设 IRQ 可在调度器前启用，但不得调用 FreeRTOS；GY53 与 USB 都特意延后到 RTOS 运行后再开放。&#x27;,
          note: &#x27;&lt;strong&gt;硬停机点：&lt;/strong&gt;MPU6050 与 ICM20948 都识别失败时，当前诊断代码会停在板级初始化阶段，后续 OLED、任务和控制环都不会进入；HSE/PLL 锁定失败也可能让程序在 main() 前表现异常。&#x27;,
          table: [
            [&#x27;阶段&#x27;, &#x27;执行位置&#x27;, &#x27;完成的事情&#x27;, &#x27;典型失败表现&#x27;],
            [&#x27;1. 复位&#x27;, &#x27;启动汇编 Reset_Handler&#x27;, &#x27;取 MSP/PC，进入 SystemInit，再由 C 运行库清 BSS/装载数据&#x27;, &#x27;向量/栈错误会直接 Fault&#x27;],
            [&#x27;2. CMSIS 时钟&#x27;, &#x27;SystemInit → SetSysClock&#x27;, &#x27;FPU、HSE、PLL、Flash 5WS、AHB/APB、VTOR&#x27;, &#x27;main 前卡住或全板时序错误&#x27;],
            [&#x27;3. 板级初始化&#x27;, &#x27;main → systemInit&#x27;, &#x27;NVIC 分组、延时、UART1、软件 I²C、识别 IMU/版本&#x27;, &#x27;识别失败进入诊断停机&#x27;],
            [&#x27;4. 版本分支&#x27;, &#x27;V1.0 / V1.1 / V1.2&#x27;, &#x27;选择 MPU6050 或 ICM20948；选择电机/CAN/USB/D50A 配置&#x27;, &#x27;选错版本会出现引脚或外设不匹配&#x27;],
            [&#x27;5. 公共外设&#x27;, &#x27;systemInit 后半段&#x27;, &#x27;GY53 配置但暂不开放、OLED、UART3/4、遥控、编码器、ADC、软件参数&#x27;, &#x27;OLED 黑屏可在此阶段定位&#x27;],
            [&#x27;6. 内核启动&#x27;, &#x27;xTaskCreate(start) → vTaskStartScheduler&#x27;, &#x27;创建 Idle/Timer，重设 SysTick=1 ms，SVC 启动首任务&#x27;, &#x27;堆不足会导致任务创建失败&#x27;],
            [&#x27;7. 启动任务&#x27;, &#x27;start_task，优先级 25&#x27;, &#x27;新版初始化 USB；批量创建业务任务；随后自删&#x27;, &#x27;USB或任务创建异常由诊断记录&#x27;],
            [&#x27;8. 稳态&#x27;, &#x27;各周期任务 + IRQ&#x27;, &#x27;100 Hz 控制/IMU，20 Hz 上报，10 Hz OLED/GY53&#x27;, &#x27;看门诊断、OLED页与串口用于观测&#x27;]
          ]
        },
        tasks: {
          title: &#x27;FreeRTOS 任务：大数值优先，和 NVIC 规则相反&#x27;,
          subtitle: &#x27;抢占与同优先级时间片均开启；任务优先级只在“线程态”之间比较。&#x27;,
          detail: &#x27;&lt;strong&gt;调度规律：&lt;/strong&gt;高优先级任务一旦就绪就抢占低优先级任务；任何正在执行的外设中断又可以抢占所有任务。&#x27;,
          note: &#x27;&lt;strong&gt;不要被名字误导：&lt;/strong&gt;Buzzer_task、Usart1_SendTask、CAN1_SendTask 是被其他任务调用的普通函数，不是独立 RTOS 任务。Timer Service 虽为 31，但当前几乎一直阻塞。&#x27;,
          table: [
            [&#x27;任务&#x27;, &#x27;优先级&#x27;, &#x27;栈（word / byte）&#x27;, &#x27;周期或阻塞&#x27;, &#x27;作用 / 条件&#x27;],
            [&#x27;Timer Service&#x27;, &#x27;31&#x27;, &#x27;260 / 1040&#x27;, &#x27;阻塞等待 timer 队列&#x27;, &#x27;内核任务；工程无用户 xTimerCreate&#x27;],
            [&#x27;start_task&#x27;, &#x27;25&#x27;, &#x27;512 / 2048&#x27;, &#x27;一次性&#x27;, &#x27;创建业务任务后自删&#x27;],
            [&#x27;USBH_Queue&#x27;, &#x27;24&#x27;, &#x27;1024 / 4096&#x27;, &#x27;永久等 USB 队列&#x27;, &#x27;仅 V1.1+；处理 HID 主机事件&#x27;],
            [&#x27;ReportErrTask&#x27;, &#x27;24&#x27;, &#x27;512 / 2048&#x27;, &#x27;500 ms 轮询&#x27;, &#x27;读取 Debug_Flag 并经 UART4 上报&#x27;],
            [&#x27;RGB 动态灯效&#x27;, &#x27;22&#x27;, &#x27;256/512 word&#x27;, &#x27;20–2000 ms&#x27;, &#x27;按需创建，同一时刻最多一个 effect&#x27;],
            [&#x27;Balance_task&#x27;, &#x27;4&#x27;, &#x27;512 / 2048&#x27;, &#x27;10 ms / 100 Hz&#x27;, &#x27;反馈、命令、安全、运动学、PI、PWM&#x27;],
            [&#x27;DATA_task&#x27;, &#x27;4&#x27;, &#x27;512 / 2048&#x27;, &#x27;50 ms / 20 Hz&#x27;, &#x27;UART/CAN 统一遥测&#x27;],
            [&#x27;PSTWO_task&#x27;, &#x27;4&#x27;, &#x27;256 / 1024&#x27;, &#x27;50 ms / 20 Hz&#x27;, &#x27;仅 V1.0 经典手柄&#x27;],
            [&#x27;IMU_task&#x27;, &#x27;3&#x27;, &#x27;256 / 1024&#x27;, &#x27;10 ms / 100 Hz&#x27;, &#x27;MPU6050 或 ICM20948 二选一&#x27;],
            [&#x27;show_task&#x27;, &#x27;2&#x27;, &#x27;512 / 2048&#x27;, &#x27;100 ms / 10 Hz&#x27;, &#x27;OLED 与 APP 状态显示&#x27;],

      function drawFlow() {
        const meta = clearSvg();
        meta.titleNode.textContent = &#x27;输入、共享状态、控制闭环与输出&#x27;;
        meta.descNode.textContent = &#x27;传感器和通信输入通过中断或任务写入共享状态，Balance任务生成电机PWM并读取编码器反馈。&#x27;;
        zone(15, 55, 250, 435, &#x27;输入与采集&#x27;);
        zone(285, 55, 210, 435, &#x27;通信 / 共享状态&#x27;);
        zone(515, 55, 335, 435, &#x27;100 Hz 电机闭环&#x27;);
        zone(870, 55, 235, 435, &#x27;显示与上报&#x27;);

        const cmd = node(35, 90, 205, 75, [&#x27;控制命令&#x27;, &#x27;UART1/3 · UART4 · CAN&#x27;, &#x27;RC · USB/PS2&#x27;], &#x27;t1&#x27;);
        const imu = node(35, 195, 205, 65, [&#x27;IMU 100 Hz&#x27;, &#x27;PB8/PB9 软件I²C&#x27;], &#x27;t2&#x27;);
        const gy = node(35, 290, 205, 76, [&#x27;GY53 ×3&#x27;, &#x27;PE5/7/8 EXTI&#x27;, &#x27;DWT测PWM脉宽&#x27;], &#x27;t4&#x27;);
        const adc = node(35, 400, 205, 60, [&#x27;ADC + 编码器&#x27;, &#x27;电压 / 模式 / TIM2–5&#x27;], &#x27;t5&#x27;);

        const irq = node(305, 115, 170, 72, [&#x27;IRQ / 驱动回调&#x27;, &#x27;字节、CAN帧、捕获边沿&#x27;], &#x27;t5&#x27;);
        const globals = node(305, 225, 170, 116, [&#x27;共享全局状态&#x27;, &#x27;robot_control · imu&#x27;, &#x27;remoter · charger&#x27;, &#x27;s21c_board · robot&#x27;], &#x27;t3&#x27;);
        const queues = node(305, 385, 170, 66, [&#x27;少量显式同步&#x27;, &#x27;USB/D50A队列&#x27;, &#x27;RGB mutex&#x27;], &#x27;t2&#x27;);

        const balance = node(540, 155, 180, 78, [&#x27;Balance_task&#x27;, &#x27;10 ms / 100 Hz&#x27;, &#x27;命令选择 + 安全&#x27;], &#x27;t1&#x27;);
        const drive = node(540, 285, 180, 70, [&#x27;Drive_Motor&#x27;, &#x27;限幅 / 平滑 / 逆运动学&#x27;], &#x27;t2&#x27;);
        const pi = node(540, 405, 180, 62, [&#x27;增量 PI&#x27;, &#x27;Target − Encoder&#x27;], &#x27;t3&#x27;);
        const pwm = node(750, 405, 80, 62, [&#x27;TIM8&#x27;, &#x27;10 kHz&#x27;], &#x27;t4&#x27;, { titleSize: 12 });
        const motors = node(750, 270, 80, 62, [&#x27;电机&#x27;, &#x27;A–D&#x27;], &#x27;t5&#x27;, { titleSize: 12 });
        const enc = node(750, 155, 80, 62, [&#x27;编码器&#x27;, &#x27;CNT读清&#x27;], &#x27;t2&#x27;, { titleSize: 12 });

        const show = node(895, 105, 185, 76, [&#x27;show_task 10 Hz&#x27;, &#x27;OLED 第1–4页&#x27;, &#x27;APP状态输出&#x27;], &#x27;t1&#x27;);
        const data = node(895, 225, 185, 76, [&#x27;DATA_task 20 Hz&#x27;, &#x27;UART1/3 + CAN&#x27;, &#x27;统一遥测帧&#x27;], &#x27;t3&#x27;);
        const alerts = node(895, 345, 185, 76, [&#x27;诊断 / 灯带&#x27;, &#x27;ReportErr · LED&#x27;, &#x27;GY53 &lt;0.5m 告警&#x27;], &#x27;t5&#x27;);

        edge(cmd, irq);
        path(`M${imu.x + imu.w},${imu.y + imu.h / 2} H280 V${globals.y + globals.h / 2} H${globals.x}`);
        path(`M${gy.x + gy.w},${gy.y + gy.h / 2} H280 V${globals.y + globals.h / 2 + 25} H${globals.x}`);
        path(`M${adc.x + adc.w},${adc.y + adc.h / 2} H280 V${globals.y + globals.h / 2 + 45} H${globals.x}`);
        edge(irq, globals);
        path(`M${irq.x + irq.w / 2},${irq.y + irq.h} V${queues.y}`);
        edge(globals, balance);
        edge(balance, drive);
        edge(drive, pi);
        edge(pi, pwm);
        path(`M${pwm.x + pwm.w / 2},${pwm.y} V${motors.y + motors.h}`);
        path(`M${motors.x + motors.w / 2},${motors.y} V${enc.y + enc.h}`);
        path(`M${enc.x},${enc.y + enc.h / 2} H735 V125 H625 V${balance.y}`, &#x27;速度反馈&#x27;, 680, 118, &#x27;feedback&#x27;);
        path(`M${globals.x + globals.w},${globals.y + 15} H860 V${show.y + show.h / 2} H${show.x}`);
        path(`M${globals.x + globals.w},${globals.y + globals.h / 2} H860 V${data.y + data.h / 2} H${data.x}`);
        path(`M${globals.x + globals.w},${globals.y + globals.h - 15} H860 V${alerts.y + alerts.h / 2} H${alerts.x}`);
        label(680, 505, &#x27;GY53 → 显示 / 上报 / 告警；当前没有连到 Balance → PI 路径&#x27;, &#x27;middle&#x27;, &#x27;muted&#x27;);
      }

      function renderTable(rows) {
        const [head, ...body] = rows;
        tableWrap.innerHTML = `
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;${head.map((cell) =&gt; `&lt;th&gt;${cell}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;${body.map((row) =&gt; `&lt;tr&gt;${row.map((cell) =&gt; `&lt;td&gt;${cell}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;
          &lt;/table&gt;`;
      }

      const draw = { clock: drawClock, boot: drawBoot, tasks: drawTasks, irq: drawIrq, flow: drawFlow };

      function render(viewName) {
        const view = views[viewName];
        title.textContent = view.title;
        subtitle.textContent = view.subtitle;
        detail.innerHTML = view.detail;
        note.innerHTML = view.note;
        renderTable(view.table);
        draw[viewName]();
        root.querySelectorAll(&#x27;.viz-tab&#x27;).forEach((button) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, button.dataset.view === viewName ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
      }

      root.querySelectorAll(&#x27;.viz-tab&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; render(button.dataset.view));
      });

      render(&#x27;clock&#x27;);
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
